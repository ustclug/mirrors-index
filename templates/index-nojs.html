<!DOCTYPE html>
<html lang="zh-Hans-CN">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="light dark">
    <title>USTC Open Source Software Mirror</title>
    <style>
        :root {
            color-scheme: light dark;
            --background: #ffffff;
            --text: #000000;
            --link: #0000ee;
            --visited-link: #551a8b;
        }
        @media (prefers-color-scheme: dark) {
            :root {
                --background: #181a1b;
                --text: #e8e6e3;
                --link: #6bb8df;
                --visited-link: #c7a6ed;
            }
        }
        body { background: var(--background); color: var(--text); }
        a:link { color: var(--link); }
        a:visited { color: var(--visited-link); }
    </style>
</head>
<body>
<h1>USTC Open Source Software Mirror</h1>
<p>This page is generated for environments without modern JavaScript support.</p>
<p>For modern browser, please use <a href="/">Homepage</a>.</p>
<ul>
{% for MODTIME, HREF, HELP, DIR in repolist -%}
    <li><a href="{{ DIR }}/">{{ DIR }}</a></li>
{% endfor -%}
</ul>
<!-- Last generated at {{ now }} -->
</body>
</html>
