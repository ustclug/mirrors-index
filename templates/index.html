<!DOCTYPE html>
<html lang="zh-Hans-CN">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
    <title>USTC Open Source Software Mirror</title>
    <link href="/static/css/fonts.css" rel="stylesheet" type="text/css">
    <link rel="shortcut icon" type="image/png" href="/static/img/favicon.png">
{% include 'style.html' %}
</head>
<body>
<!-- Last generated at {{ now }} -->
<main id="root">
    <h1>USTC Open Source Software Mirror</h1>
    <p>JavaScript is unavailable. The mirror repositories remain accessible below.</p>
    <ul>
    {% for MODTIME, HREF, HELP, DIR in repolist -%}
        <li><a href="{{ DIR }}/">{{ DIR }}</a></li>
    {% endfor -%}
    </ul>
</main>
<script id="mirrors-bootstrap" type="application/json">{{ bootstrap|safe }}</script>
<script type="module" src="{{ index_script }}"></script>
</body>
</html>
