<!DOCTYPE html>
<html>
  <head>
    <title>USTC Mirrors Status</title>
    <meta charset="utf-8" />
    <style>
      /* http://tristen.ca/tablesort/tablesort.css */

      th[role="columnheader"]:not(.no-sort) {
        cursor: pointer;
      }

      th[role="columnheader"]:not(.no-sort):after {
        content: "";
        float: right;
        margin-top: 7px;
        border-width: 0 4px 4px;
        border-style: solid;
        border-color: #404040 transparent;
        visibility: hidden;
        opacity: 0;
        -ms-user-select: none;
        -webkit-user-select: none;
        -moz-user-select: none;
        user-select: none;
      }

      th[aria-sort="ascending"]:not(.no-sort):after {
        border-bottom: none;
        border-width: 4px 4px 0;
      }

      th[aria-sort]:not(.no-sort):after {
        visibility: visible;
        opacity: 0.4;
      }

      th[role="columnheader"]:not(.no-sort):hover:after {
        visibility: visible;
        opacity: 1;
      }
    </style>
    <style>
      body {
        margin: 0;
      }

      table {
        background: #fff;
        max-width: 100%;
        width: 100%;
        margin: 10px 0;
      }
      table th,
      table td {
        padding: 8px;
        line-height: 18px;
        text-align: left;
      }
      table th {
        background: #eee;
        text-shadow: 0 1px 0 #fff;
        font-weight: bold;
        vertical-align: bottom;
      }
      table td {
        vertical-align: top;
      }

      table th:hover,
      table tr:hover {
        background: #e0e0e0;
      }

      .failedSync {
        background-color: #fff4e3;
      }

      .ongoingSync {
        background-color: #e3f7ff;
      }

      #sync,
      #server,
      #links {
        margin: 20px;
      }

      #nav {
        height: 20px;
        padding: 20px 0;
        background-color: #f2f2f2;
      }

      #nav a {
        text-decoration: none;
        margin-left: 20px;
        color: #666;
      }

      .withComment {
        position: relative;
        display: inline-block;
      }

      .withComment .comment {
        visibility: hidden;
        width: 120px;
        background-color: black;
        color: #fff;
        text-align: center;
        border-radius: 6px;
        padding: 5px 0;

        /* Position the tooltip */
        position: absolute;
        z-index: 1;
        top: -5px;
        left: 105%;
      }

      .withComment:hover .comment {
        visibility: visible;
      }
    </style>
  </head>

  <body>
    <div id="root"><p>此页面需要 JavaScript 才能显示同步状态。</p></div>
    <script type="module" src="{{ STATUS_SCRIPT }}"></script>
  </body>
</html>
